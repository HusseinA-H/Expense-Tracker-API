<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-label="CI/CD pipeline">
  <rect width="880" height="320" fill="#0f172a" rx="12"/>
  <text x="440" y="36" fill="#f8fafc" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" text-anchor="middle">CI/CD Pipeline</text>
  <g font-family="Segoe UI,sans-serif">
    <rect x="40" y="80" width="120" height="56" rx="8" fill="#24292f"/><text x="100" y="114" fill="#fff" font-size="12" text-anchor="middle">Push / PR</text>
    <rect x="200" y="80" width="120" height="56" rx="8" fill="#1f6feb"/><text x="260" y="114" fill="#fff" font-size="12" text-anchor="middle">Lint</text>
    <rect x="360" y="80" width="120" height="56" rx="8" fill="#059669"/><text x="420" y="114" fill="#fff" font-size="12" text-anchor="middle">Test</text>
    <rect x="520" y="80" width="120" height="56" rx="8" fill="#7c3aed"/><text x="580" y="114" fill="#fff" font-size="12" text-anchor="middle">Docker Build</text>
    <rect x="680" y="80" width="160" height="56" rx="8" fill="#ea580c"/><text x="760" y="114" fill="#fff" font-size="12" text-anchor="middle">GHCR Publish</text>
    <polygon points="100,160 100,200 760,200 760,160" fill="none" stroke="#475569" stroke-width="2"/>
    <text x="440" y="188" fill="#94a3b8" font-size="11" text-anchor="middle">Tag v*.*.* triggers CD ’ staging smoke ’ production deploy bundle</text>
    <rect x="120" y="230" width="640" height="64" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="440" y="258" fill="#e2e8f0" font-size="12" text-anchor="middle">Postgres 16 + Redis 7 service containers · alembic migrate · pytest integration</text>
    <text x="440" y="278" fill="#64748b" font-size="11" text-anchor="middle">black · isort · flake8 · multi-stage non-root images</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="160" y1="108" x2="200" y2="108"/><line x1="320" y1="108" x2="360" y2="108"/>
    <line x1="480" y1="108" x2="520" y2="108"/><line x1="640" y1="108" x2="680" y2="108"/>
  </g>
</svg>
