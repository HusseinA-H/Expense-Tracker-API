<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="System architecture">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="url(#bg)" rx="16"/>
  <text x="480" y="36" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Expense Tracker API  System Context</text>
  <g filter="url(#shadow)">
    <rect x="40" y="80" width="120" height="56" rx="8" fill="#3b82f6"/>
    <text x="100" y="114" fill="#fff" font-size="13" text-anchor="middle" font-family="Segoe UI">Client</text>
    <rect x="220" y="80" width="120" height="56" rx="8" fill="#6366f1"/>
    <text x="280" y="114" fill="#fff" font-size="13" text-anchor="middle" font-family="Segoe UI">Nginx</text>
    <rect x="400" y="80" width="140" height="56" rx="8" fill="#10b981"/>
    <text x="470" y="114" fill="#fff" font-size="13" text-anchor="middle" font-family="Segoe UI">FastAPI</text>
    <rect x="580" y="60" width="140" height="56" rx="8" fill="#f59e0b"/>
    <text x="650" y="94" fill="#fff" font-size="13" text-anchor="middle" font-family="Segoe UI">Celery</text>
    <rect x="580" y="140" width="140" height="56" rx="8" fill="#f59e0b"/>
    <text x="650" y="174" fill="#fff" font-size="13" text-anchor="middle" font-family="Segoe UI">Beat</text>
    <rect x="780" y="80" width="140" height="56" rx="8" fill="#334155" stroke="#64748b"/>
    <text x="850" y="114" fill="#e2e8f0" font-size="13" text-anchor="middle" font-family="Segoe UI">Jaeger</text>
    <rect x="200" y="220" width="160" height="72" rx="10" fill="#0ea5e9"/>
    <text x="280" y="252" fill="#fff" font-size="14" text-anchor="middle" font-family="Segoe UI">PostgreSQL</text>
    <text x="280" y="272" fill="#bae6fd" font-size="11" text-anchor="middle" font-family="Segoe UI">Primary + optional read</text>
    <rect x="420" y="220" width="120" height="72" rx="10" fill="#dc2626"/>
    <text x="480" y="258" fill="#fff" font-size="14" text-anchor="middle" font-family="Segoe UI">Redis</text>
    <text x="480" y="278" fill="#fecaca" font-size="11" text-anchor="middle" font-family="Segoe UI">Broker + cache</text>
    <rect x="580" y="220" width="140" height="72" rx="10" fill="#64748b"/>
    <text x="650" y="258" fill="#fff" font-size="14" text-anchor="middle" font-family="Segoe UI">SMTP</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker></defs>
    <line x1="160" y1="108" x2="220" y2="108"/>
    <line x1="340" y1="108" x2="400" y2="108"/>
    <line x1="540" y1="108" x2="580" y2="88"/>
    <line x1="470" y1="136" x2="480" y2="220"/>
    <line x1="650" y1="116" x2="480" y2="240"/>
    <line x1="850" y1="136" x2="540" y2="120"/>
    <line x1="650" y1="196" x2="480" y2="250"/>
    <line x1="650" y1="256" x2="560" y2="256"/>
  </g>
  <text x="480" y="360" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="Segoe UI">Async tasks: email · budgets · reports · receipts · maintenance</text>
  <text x="480" y="480" fill="#64748b" font-size="11" text-anchor="middle" font-family="Segoe UI">OpenTelemetry traces API, SQLAlchemy, Redis, and Celery ’ Jaeger</text>
</svg>
