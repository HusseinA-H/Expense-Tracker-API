<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Application layers">
  <rect width="720" height="400" fill="#fff" rx="12"/>
  <text x="360" y="32" fill="#0f172a" font-family="Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Clean Architecture Layers</text>
  <rect x="80" y="56" width="560" height="56" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="360" y="88" fill="#1e40af" font-size="14" text-anchor="middle" font-family="Segoe UI">Presentation  API v1 Endpoints · deps · health</text>
  <rect x="80" y="128" width="560" height="56" rx="8" fill="#dcfce7" stroke="#16a34a"/>
