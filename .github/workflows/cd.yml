name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Container image tag to deploy
        required: true
        default: 1.0.0-rc.1
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:
    name: Build and publish release images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.image_tag || '1.0.0-rc.1' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/api"
          VERSION="${{ steps.meta.outputs.version }}"
          docker buildx build -f docker/Dockerfile \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .
      - name: Build and push Celery image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/celery"
          VERSION="${{ steps.meta.outputs.version }}"
          docker buildx build -f docker/Dockerfile.celery.prod \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" --push .
      - name: Publish deployment artifact
        run: |
          mkdir -p release-artifacts
          cp docker-compose.yml docker-compose.prod.yml VERSION release-artifacts/
          cp -r docker release-artifacts/
          cp .env.production.example release-artifacts/
          tar -czf release-${{ steps.meta.outputs.version }}.tar.gz release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: release-${{ steps.meta.outputs.version }}.tar.gz

  staging-smoke:
    name: Staging smoke (manual/tag)
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test production image
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          IMAGE="ghcr.io/${{ github.repository }}/api:$VERSION"
          echo "Run staging deployment checklist against $IMAGE"
          echo "See docs/deployment/staging-deployment.md"
